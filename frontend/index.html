<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>JDDL — Independent design studio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <p class="about"></p>
    <nav class="menu" aria-label="Projects"></nav>
  </header>
  <main class="portfolio" aria-label="Selected projects">
    <p id="status" role="status">Loading projects…</p>
    <div class="project-context">
      <p id="description" aria-live="polite" aria-atomic="true"><span id="project-title"></span><span id="project-copy"></span></p>
      <div class="stories" role="group" aria-label="Gallery images"></div>
    </div>
    <div class="rail" tabindex="0" role="region" aria-label="Project gallery. Scroll horizontally or use left and right arrow keys.">
      <div class="track"></div>
    </div>
  </main>
  <section id="gallery" class="orbit-gallery" hidden tabindex="0" role="region" aria-label="Image index. Drag, scroll, or use up and down arrow keys to move vertically. Escape returns to Highlights.">
    <div id="field" class="orbit-field"></div>
    <div class="orbit-controls">
      <label>Order <input id="chaos" type="range" min="0" max="100" value="72" aria-label="Order to chaos"> Chaos <output id="chaos-value" for="chaos">72%</output></label>
      <label>Thin <input id="viscosity" type="range" min="0" max="100" value="80" aria-label="Motion viscosity"> Thick <output id="viscosity-value" for="viscosity">80%</output></label>
      <span>Drag or scroll · Esc to Highlights</span>
    </div>
  </section>
</body>
</html>
