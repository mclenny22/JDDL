<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f6">
  <title>AD4K — Independent design studio</title>
  <meta name="description" content="AD4K — Independent design studio.">
  <link rel="canonical" href="https://www.ad4k.studio/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AD4K">
  <meta property="og:title" content="AD4K — Independent design studio">
  <meta property="og:description" content="Independent design studio.">
  <meta property="og:url" content="https://www.ad4k.studio/">
  <meta property="og:image" content="https://www.ad4k.studio/assets/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="AD4K logo on a light background.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AD4K — Independent design studio">
  <meta name="twitter:description" content="Independent design studio.">
  <meta name="twitter:image" content="https://www.ad4k.studio/assets/social-preview.png">
  <meta name="twitter:image:alt" content="AD4K logo on a light background.">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="studio"><a class="studio-logo" href="#" aria-label="Selected projects"><picture class="logo-dark"><source media="(max-width: 600px)" srcset="assets/ad4k-logo-mobile.svg"><img src="assets/ad4k-logo.svg" alt="AD4K"></picture><picture class="logo-light" aria-hidden="true"><source media="(max-width: 600px)" srcset="assets/ad4k-logo-mobile-light.svg"><img src="assets/ad4k-logo-light.svg" alt=""></picture></a><p class="about"></p></div>
    <nav class="index-filters" aria-label="Filter images by category" hidden></nav>
    <button class="mobile-menu-trigger" type="button" aria-controls="studio-menu" aria-expanded="false">MENU</button>
    <nav id="studio-menu" class="menu" aria-label="Projects"></nav>
  </header>
  <main class="portfolio" aria-label="Selected projects">
    <p id="status" role="status">Loading projects…</p>
    <div class="rail" tabindex="0" role="region" aria-label="Project gallery. Scroll horizontally or use left and right arrow keys.">
      <div class="track"></div>
    </div>
  </main>
  <section id="gallery" class="orbit-gallery" hidden tabindex="0" role="region" aria-label="Image index. Drag in any direction, scroll, or use all four arrow keys. Shift-scroll moves horizontally. Escape returns to Selected.">
    <div id="field" class="orbit-field"></div>

  </section>
  <section id="project-detail" class="project-detail" hidden tabindex="-1" aria-label="Project detail">
    <div class="project-detail-content">
      <div class="project-detail-info"></div>
      <img class="project-hero" alt="">
      <div class="project-grid"></div>
      <button class="project-close" type="button" aria-label="Return to selected projects">Back to selected ↗</button>
    </div>
    <footer class="project-footer"></footer>
  </section>
  <section id="studio-detail" class="studio-detail" hidden tabindex="-1" aria-label="About the studio"><div class="studio-detail-copy"></div><button class="studio-close" type="button">Back to selected ↗</button></section>
  <footer class="site-footer"><p id="footer-contact"></p><p id="footer-email"></p><p id="footer-address"></p></footer>
</body>
</html>
