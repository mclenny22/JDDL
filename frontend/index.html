<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>JDDL — Independent design studio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="menu-shape-definitions" width="0" height="0" aria-hidden="true" focusable="false">
    <defs><clipPath id="menu-scalloped-pill" clipPathUnits="objectBoundingBox"><path d="M .12 0 H .88 C .92 0 .90 .16 .96 .20 C 1 .23 1 .35 .97 .50 C 1 .65 1 .77 .96 .80 C .90 .84 .92 1 .88 1 H .12 C .08 1 .10 .84 .04 .80 C 0 .77 0 .65 .03 .50 C 0 .35 0 .23 .04 .20 C .10 .16 .08 0 .12 0 Z"/></clipPath></defs>
  </svg>
  <header class="masthead">
    <div class="studio"><a class="studio-logo" href="#" aria-label="Selected projects"><img class="logo-dark" src="assets/logo.svg" alt="Studio logo"><img class="logo-light" src="assets/logo-light.svg" alt="" aria-hidden="true"></a><p class="about"></p></div>
    <button class="mobile-menu-trigger" type="button" aria-controls="studio-menu" aria-expanded="false">MENU</button>
    <nav id="studio-menu" class="menu" aria-label="Projects"></nav>
  </header>
  <main class="portfolio" aria-label="Selected projects">
    <p id="status" role="status">Loading projects…</p>
    <div class="project-context">
      <p id="description" aria-live="polite" aria-atomic="true"><span id="project-title"></span><span id="project-copy"></span></p>
      <div class="stories" role="group" aria-label="Gallery images"></div>
    </div>
    <div class="rail" tabindex="0" role="region" aria-label="Project gallery. Scroll horizontally or use left and right arrow keys.">
      <div class="track"></div>
    </div>
  </main>
  <section id="gallery" class="orbit-gallery" hidden tabindex="0" role="region" aria-label="Image index. Drag in any direction, scroll, or use all four arrow keys. Shift-scroll moves horizontally. Escape returns to Selected.">
    <div id="field" class="orbit-field"></div>

  </section>
  <section id="project-detail" class="project-detail" hidden tabindex="-1" aria-label="Project detail">
    <button class="project-close" type="button" aria-label="Return to selected projects">Back to selected ↗</button>
    <div class="project-detail-content">
      <div class="project-detail-info"></div>
      <img class="project-hero" alt="">
      <div class="project-grid"></div>
    </div>
  </section>
  <footer class="site-footer"><p id="footer-contact"></p><p id="footer-address"></p><p id="footer-email"></p></footer>
</body>
</html>
