<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A center-weighted, Apple Watch-inspired editorial image field."
    />
    <title>JDDL — Interactive Image Field</title>

    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #ececea;
      }

      button,
      a,
      input,
      output {
        font: inherit;
      }

      button:focus-visible,
      a:focus-visible,
      .gallery:focus-visible {
        outline: 2px solid #161616;
        outline-offset: 3px;
      }

      .gallery {
        position: relative;
        width: 100%;
        height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.9), transparent 48%),
          #ececea;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .gallery.is-dragging {
        cursor: grabbing;
      }

      .field {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .tile {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--width);
        height: var(--height);
        margin: 0;
        opacity: var(--opacity, 0);
        transform:
          translate3d(var(--x, 0), var(--y, 0), 0)
          rotate(var(--rotation, 0deg))
          scale(var(--scale, 0.4));
        transform-origin: center;
        will-change: transform, opacity;
      }

      .tile img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: clamp(0.8rem, 2.2vw, 1.65rem);
        object-fit: cover;
        box-shadow:
          0 1.4rem 3.5rem rgba(29, 29, 27, 0.12),
          0 0 0 1px rgba(29, 29, 27, 0.05);
        pointer-events: none;
      }

      .chrome {
        position: absolute;
        z-index: 5000;
        top: clamp(0.8rem, 2.2vw, 1.5rem);
        right: clamp(0.8rem, 2.2vw, 1.5rem);
        left: clamp(0.8rem, 2.2vw, 1.5rem);
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .brand,
      .actions {
        border: 1px solid rgba(23, 23, 21, 0.09);
        border-radius: 999px;
        background: rgba(246, 246, 243, 0.78);
        box-shadow: 0 0.5rem 2rem rgba(29, 29, 27, 0.08);
        backdrop-filter: blur(1.1rem) saturate(140%);
        pointer-events: auto;
      }

      .brand {
        display: inline-flex;
        gap: 0.55rem;
        align-items: center;
        min-height: 2.65rem;
        padding: 0 1rem;
        color: #161616;
        font-size: 0.68rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .brand::before {
        width: 0.5rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #161616;
        content: "";
      }

      .actions {
        display: flex;
        gap: 0.15rem;
        align-items: center;
        padding: 0.25rem;
      }

      .chaos-control,
      .viscosity-control {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        min-height: 2.15rem;
        padding: 0 0.65rem 0 0.8rem;
        color: rgba(22, 22, 22, 0.58);
        font-size: 0.56rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .chaos-control input,
      .viscosity-control input {
        width: clamp(5.5rem, 9vw, 8rem);
        height: 1rem;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      .chaos-control input::-webkit-slider-runnable-track,
      .viscosity-control input::-webkit-slider-runnable-track {
        height: 0.2rem;
        border-radius: 99px;
        background: linear-gradient(
          to right,
          #161616 0 var(--progress, 72%),
          rgba(22, 22, 22, 0.16) var(--progress, 72%) 100%
        );
      }

      .chaos-control input::-webkit-slider-thumb,
      .viscosity-control input::-webkit-slider-thumb {
        width: 0.8rem;
        height: 0.8rem;
        margin-top: -0.3rem;
        appearance: none;
        border: 0;
        border-radius: 50%;
        background: #161616;
        box-shadow: 0 0.15rem 0.4rem rgba(22, 22, 22, 0.2);
      }

      .chaos-control input::-moz-range-track,
      .viscosity-control input::-moz-range-track {
        height: 0.2rem;
        border-radius: 99px;
        background: rgba(22, 22, 22, 0.16);
      }

      .chaos-control input::-moz-range-progress,
      .viscosity-control input::-moz-range-progress {
        height: 0.2rem;
        border-radius: 99px;
        background: #161616;
      }

      .chaos-control input::-moz-range-thumb,
      .viscosity-control input::-moz-range-thumb {
        width: 0.8rem;
        height: 0.8rem;
        border: 0;
        border-radius: 50%;
        background: #161616;
      }

      .chaos-value,
      .viscosity-value {
        min-width: 2.2rem;
        color: #161616;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .action {
        min-height: 2.15rem;
        padding: 0 0.85rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #161616;
        cursor: pointer;
        font-size: 0.62rem;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .action:hover {
        background: rgba(22, 22, 22, 0.07);
      }

      .hint {
        position: absolute;
        z-index: 5000;
        bottom: clamp(0.8rem, 2.2vw, 1.5rem);
        left: 50%;
        padding: 0.7rem 0.95rem;
        border: 1px solid rgba(23, 23, 21, 0.09);
        border-radius: 999px;
        background: rgba(246, 246, 243, 0.78);
        box-shadow: 0 0.5rem 2rem rgba(29, 29, 27, 0.08);
        color: rgba(22, 22, 22, 0.68);
        font-size: 0.62rem;
        font-weight: 720;
        letter-spacing: 0.1em;
        pointer-events: none;
        text-transform: uppercase;
        transform: translateX(-50%);
        backdrop-filter: blur(1.1rem) saturate(140%);
        transition: opacity 260ms ease;
      }

      .gallery.has-interacted .hint {
        opacity: 0;
      }

      @media (max-width: 540px) {
        .brand span {
          display: none;
        }

        .brand {
          width: 2.65rem;
          padding: 0;
          justify-content: center;
        }

        .chaos-pole,
        .chaos-value,
        .viscosity-pole,
        .viscosity-value {
          display: none;
        }

        .chaos-control,
        .viscosity-control {
          padding: 0 0.35rem 0 0.55rem;
        }

        .chaos-control input,
        .viscosity-control input {
          width: 4.6rem;
        }

        .action {
          padding: 0 0.55rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hint {
          transition: none;
        }
      }
    </style>
    <style>
      .filters {
        position: absolute;
        z-index: 5000;
        top: clamp(0.8rem, 2vw, 1.35rem);
        right: clamp(0.8rem, 2vw, 1.35rem);
        left: clamp(0.8rem, 2vw, 1.35rem);
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
        pointer-events: none;
      }

      .filter {
        min-height: 1.7rem;
        padding: 0 0.58rem;
        border: 1px solid rgba(22, 22, 22, 0.08);
        border-radius: 0.32rem;
        background: rgba(255, 255, 255, 0.78);
        color: #161616;
        cursor: pointer;
        font-size: clamp(0.56rem, 0.72vw, 0.7rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        pointer-events: auto;
        text-transform: uppercase;
        transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
      }

      .filter:hover,
      .filter[aria-pressed="true"] {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-text, #161616);
        transform: translateY(-1px);
      }

      .fixed-controls {
        position: absolute;
        z-index: 5000;
        right: clamp(0.8rem, 2vw, 1.35rem);
        bottom: clamp(0.8rem, 2vw, 1.35rem);
        display: grid;
        gap: 0.25rem;
        min-width: min(19rem, calc(100% - 1.6rem));
        padding: 0.48rem 0.58rem;
        border: 1px solid rgba(23, 23, 21, 0.055);
        border-radius: 0.75rem;
        background: rgba(246, 246, 243, 0.46);
        backdrop-filter: blur(0.9rem) saturate(125%);
      }

      .field-control {
        display: grid;
        grid-template-columns: 3.5rem minmax(5.5rem, 1fr) 2.6rem;
        gap: 0.55rem;
        align-items: center;
        min-height: 1.35rem;
        color: rgba(22, 22, 22, 0.43);
        font-size: 0.54rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .field-control input {
        width: 100%;
        height: 1rem;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      .field-control input::-webkit-slider-runnable-track {
        height: 0.14rem;
        border-radius: 999px;
        background: linear-gradient(
          to right,
          rgba(22, 22, 22, 0.65) 0 var(--progress, 50%),
          rgba(22, 22, 22, 0.13) var(--progress, 50%) 100%
        );
      }

      .field-control input::-webkit-slider-thumb {
        width: 0.62rem;
        height: 0.62rem;
        margin-top: -0.24rem;
        appearance: none;
        border: 0;
        border-radius: 50%;
        background: rgba(22, 22, 22, 0.72);
      }

      .field-control input::-moz-range-track {
        height: 0.14rem;
        border-radius: 999px;
        background: rgba(22, 22, 22, 0.13);
      }

      .field-control input::-moz-range-progress {
        height: 0.14rem;
        border-radius: 999px;
        background: rgba(22, 22, 22, 0.65);
      }

      .field-control input::-moz-range-thumb {
        width: 0.62rem;
        height: 0.62rem;
        border: 0;
        border-radius: 50%;
        background: rgba(22, 22, 22, 0.72);
      }

      .field-control output {
        color: rgba(22, 22, 22, 0.58);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      @media (max-width: 620px) {
        .filters {
          gap: 0.25rem;
        }

        .filter {
          min-height: 1.5rem;
          padding: 0 0.42rem;
          font-size: 0.52rem;
        }

        .fixed-controls {
          min-width: min(17rem, calc(100% - 1.6rem));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .filter {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main
      class="gallery"
      id="gallery"
      role="application"
      tabindex="0"
      aria-label="Interactive editorial image field. Drag, scroll, or use the up and down arrow keys to move vertically."
    >
      <div class="field" id="field" aria-hidden="true"></div>

      <nav class="filters" aria-label="Filter projects by discipline">
        <button class="filter" type="button" data-tag="All" aria-pressed="true" style="--accent: #ffffff">All</button>
        <button class="filter" type="button" data-tag="Branding" aria-pressed="false" style="--accent: #9dff2f">Branding</button>
        <button class="filter" type="button" data-tag="Web" aria-pressed="false" style="--accent: #26bd49">Web</button>
        <button class="filter" type="button" data-tag="Graphic" aria-pressed="false" style="--accent: #2638e8; --accent-text: #ffffff">Graphic</button>
        <button class="filter" type="button" data-tag="CGI" aria-pressed="false" style="--accent: #ff4747">CGI</button>
        <button class="filter" type="button" data-tag="Illustration" aria-pressed="false" style="--accent: #111111; --accent-text: #ffffff">Illustration</button>
        <button class="filter" type="button" data-tag="Editorial" aria-pressed="false" style="--accent: #b17b00">Editorial</button>
        <button class="filter" type="button" data-tag="Merchandise" aria-pressed="false" style="--accent: #f3a9cc">Merchandise</button>
        <button class="filter" type="button" data-tag="Spatial" aria-pressed="false" style="--accent: #b6b6b6">Spatial</button>
        <button class="filter" type="button" data-tag="Packaging" aria-pressed="false" style="--accent: #ffbd22">Packaging</button>
      </nav>

      <div class="fixed-controls" aria-label="Image field controls">
        <label class="field-control" for="lens">
          <span>Lens</span>
          <input id="lens" type="range" min="55" max="145" value="100" aria-label="Lens image size" />
          <output id="lens-value" for="lens">100%</output>
        </label>
        <label class="field-control" for="viscosity">
          <span>Viscosity</span>
          <input id="viscosity" type="range" min="0" max="100" value="72" aria-label="Motion viscosity" />
          <output id="viscosity-value" for="viscosity">72%</output>
        </label>
      </div>

      <div hidden aria-hidden="true">
        <input id="chaos" type="range" min="0" max="100" value="35" />
        <output id="chaos-value" for="chaos">35%</output>
        <button id="shuffle" type="button">Shuffle</button>
        <button id="reset" type="button">Reset</button>
      </div>

    </main>

    <script>
      (() => {
        const gallery = document.querySelector("#gallery");
        const field = document.querySelector("#field");
        const chaosControl = document.querySelector("#chaos");
        const chaosOutput = document.querySelector("#chaos-value");
        const lensControl = document.querySelector("#lens");
        const lensOutput = document.querySelector("#lens-value");
        const viscosityControl = document.querySelector("#viscosity");
        const viscosityOutput = document.querySelector("#viscosity-value");
        const filterButtons = [...document.querySelectorAll(".filter")];
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        const tileCount = 112;
        const defaultColumns = 3;
        const defaultChaos = 35;
        const defaultLens = 100;
        const defaultViscosity = 72;
        const minimumGap = 10;
        const targetGap = minimumGap + 1.25;

        const sources = [
          ["1:1", 1000, 1000, "orbit-salt", "Atmospheric landscape in a square crop", ["Branding", "CGI"]],
          ["4:5", 1000, 1250, "orbit-stone", "Editorial scene in a portrait crop", ["Editorial", "Graphic"]],
          ["16:9", 1600, 900, "orbit-road", "Cinematic landscape in a widescreen crop", ["Web", "Spatial"]],
          ["9:16", 900, 1600, "orbit-tower", "Tall architecture in a vertical crop", ["Spatial", "Branding"]],
          ["1:1", 1000, 1000, "orbit-water", "Water and light in a square crop", ["CGI", "Packaging"]],
          ["4:5", 1000, 1250, "orbit-desert", "Desert tones in a portrait crop", ["Illustration", "Editorial"]],
          ["16:9", 1600, 900, "orbit-night", "Night landscape in a widescreen crop", ["Web", "CGI"]],
          ["9:16", 900, 1600, "orbit-forest", "Forest scene in a tall crop", ["Illustration", "Packaging"]],
          ["1:1", 1000, 1000, "orbit-metal", "Reflective material in a square crop", ["Branding", "Merchandise"]],
          ["4:5", 1000, 1250, "orbit-fabric", "Textile detail in a portrait crop", ["Merchandise", "Graphic"]],
          ["16:9", 1600, 900, "orbit-field", "Open field in a widescreen crop", ["Web", "Editorial"]],
          ["9:16", 900, 1600, "orbit-poster", "Graphic poster in a vertical crop", ["Graphic", "Illustration"]],
        ];

        const state = {
          seed: 28117,
          width: 0,
          height: 0,
          planeWidth: 0,
          planeHeight: 0,
          unit: 0,
          cameraX: 0,
          cameraY: 0,
          velocityY: 0,
          pointerId: null,
          pointerY: 0,
          frame: 0,
          tiles: [],
          columns: defaultColumns,
          activeTags: new Set(),
        };

        function clamp(number, minimum, maximum) {
          return Math.max(minimum, Math.min(maximum, number));
        }

        function mix(start, end, amount) {
          return start + (end - start) * amount;
        }

        function smoothstep(start, end, input) {
          const progress = clamp((input - start) / (end - start), 0, 1);
          return progress * progress * (3 - 2 * progress);
        }

        function chaosLevel() {
          return Number(chaosControl.value) / 100;
        }

        function updateChaosControl() {
          chaosOutput.value = `${chaosControl.value}%`;
          chaosControl.style.setProperty("--progress", `${chaosControl.value}%`);
        }

        function lensLevel() {
          return Number(lensControl.value) / 100;
        }

        function updateLensControl() {
          const minimum = Number(lensControl.min);
          const maximum = Number(lensControl.max);
          const progress = ((Number(lensControl.value) - minimum) / (maximum - minimum)) * 100;
          lensOutput.value = `${lensControl.value}%`;
          lensControl.style.setProperty("--progress", `${progress}%`);
        }

        function viscosityLevel() {
          return Number(viscosityControl.value) / 100;
        }

        function updateViscosityControl() {
          viscosityOutput.value = `${viscosityControl.value}%`;
          viscosityControl.style.setProperty("--progress", `${viscosityControl.value}%`);
        }

        function noise(index, channel = 0) {
          const raw = Math.sin(state.seed * 0.019 + index * 91.73 + channel * 37.11) * 43758.5453;
          return (raw - Math.floor(raw)) * 2 - 1;
        }

        function sourceFor(index) {
          const sourceIndex = Math.abs(Math.floor(index * 5 + noise(index, 8) * 7)) % sources.length;
          return sources[sourceIndex];
        }

        function matchesFilter(tile) {
          return state.activeTags.size === 0 || tile.tags.some((tag) => state.activeTags.has(tag));
        }

        function updateFilterButtons() {
          filterButtons.forEach((button) => {
            const tag = button.dataset.tag;
            const active = tag === "All" ? state.activeTags.size === 0 : state.activeTags.has(tag);
            button.setAttribute("aria-pressed", String(active));
          });
        }

        function createTiles() {
          field.replaceChildren();
          state.tiles = [];

          for (let index = 0; index < tileCount; index += 1) {
            const [ratio, width, height, seed, alt, tags] = sourceFor(index);
            const figure = document.createElement("figure");
            const image = document.createElement("img");

            figure.className = "tile";
            image.src = `https://picsum.photos/seed/${seed}-${index % 4}/${width}/${height}`;
            image.alt = alt;
            image.width = width;
            image.height = height;
            image.draggable = false;
            image.loading = index < 28 ? "eager" : "lazy";
            figure.dataset.ratio = ratio;
            figure.dataset.tags = tags.join(",");
            figure.append(image);
            field.append(figure);

            state.tiles.push({
              index,
              tags,
              aspect: width / height,
              element: figure,
              offsetX: noise(index, 1),
              offsetY: noise(index, 2),
              sizeNoise: noise(index, 3),
              rotationNoise: noise(index, 4),
              edgeNoiseX: noise(index, 5),
              edgeNoiseY: noise(index, 6),
              x: Number.NaN,
              y: Number.NaN,
              scale: Number.NaN,
              rotation: Number.NaN,
              opacity: Number.NaN,
              motionX: 0,
              motionY: 0,
              motionScale: 0,
              motionRotation: 0,
            });
          }
        }

        function layout({ recenter = false } = {}) {
          const rect = gallery.getBoundingClientRect();
          state.width = rect.width;
          state.height = rect.height;
          state.unit = clamp(rect.width / (state.columns * 1.18), 72, 132);

          const columnStep = state.unit * 1.18;
          const rowStep = state.unit * 1.2;
          const padding = state.unit * 0.65;
          const chaos = chaosLevel();
          const shapeChaos = smoothstep(0, 0.55, chaos);
          const visibleTiles = state.tiles.filter(matchesFilter);
          const visibleRows = Math.max(1, Math.ceil(visibleTiles.length / state.columns));

          state.planeWidth = padding * 2 + columnStep * (state.columns - 1) + state.unit * 1.2;
          state.planeHeight = padding * 2 + rowStep * (visibleRows - 1) + state.unit * 1.35;

          state.tiles.forEach((tile) => {
            tile.visible = false;
            tile.element.style.visibility = "hidden";
            tile.element.style.setProperty("--opacity", "0");
          });

          visibleTiles.forEach((tile, visibleIndex) => {
            tile.visible = true;
            tile.row = Math.floor(visibleIndex / state.columns);
            tile.column = visibleIndex % state.columns;
            tile.element.style.visibility = "visible";
            const wide = tile.aspect > 1.2;
            const tall = tile.aspect < 0.72;
            const portrait = tile.aspect < 0.95;
            const baseWidth = state.unit * (wide ? 1.34 : tall ? 0.67 : portrait ? 0.86 : 0.98);
            const sizeVariation = 1 + tile.sizeNoise * 0.39 * chaos;
            const chaoticWidth = baseWidth * sizeVariation;
            const chaoticHeight = (baseWidth / tile.aspect) * sizeVariation;
            const orderlySize = state.unit * 0.92;
            const width = orderlySize + (chaoticWidth - orderlySize) * shapeChaos;
            const height = orderlySize + (chaoticHeight - orderlySize) * shapeChaos;
            const stagger = tile.row % 2 ? (columnStep / 2) * shapeChaos : 0;

            tile.width = width;
            tile.height = height;
            tile.baseX =
              padding +
              tile.column * columnStep +
              stagger +
              tile.offsetX * state.unit * 0.31 * chaos;
            tile.baseY =
              padding + tile.row * rowStep + tile.offsetY * state.unit * 0.25 * chaos;
            tile.element.style.setProperty("--width", `${width}px`);
            tile.element.style.setProperty("--height", `${height}px`);
          });

          if (recenter) {
            state.cameraX = (state.width - state.planeWidth) / 2;
            state.cameraY = (state.height - state.planeHeight) / 2;
            state.velocityY = 0;
            state.tiles.forEach((tile) => {
              tile.x = Number.NaN;
              tile.y = Number.NaN;
              tile.scale = Number.NaN;
              tile.motionX = 0;
              tile.motionY = 0;
              tile.motionScale = 0;
              tile.motionRotation = 0;
            });
          }

          requestFrame();
        }

        function rotatedBounds(width, height, scale, rotation) {
          const radians = (rotation * Math.PI) / 180;
          const cosine = Math.abs(Math.cos(radians));
          const sine = Math.abs(Math.sin(radians));
          const scaledWidth = width * scale;
          const scaledHeight = height * scale;

          return {
            width: scaledWidth * cosine + scaledHeight * sine,
            height: scaledWidth * sine + scaledHeight * cosine,
          };
        }

        function separate(items, gap, passes) {
          for (let pass = 0; pass < passes; pass += 1) {
            let separated = false;

            for (let firstIndex = 0; firstIndex < items.length; firstIndex += 1) {
              const first = items[firstIndex];

              for (let secondIndex = firstIndex + 1; secondIndex < items.length; secondIndex += 1) {
                const second = items[secondIndex];
                if (first.opacity < 0.015 && second.opacity < 0.015) continue;

                const deltaX = first.x - second.x;
                const deltaY = first.y - second.y;
                const overlapX = (first.width + second.width) / 2 + gap - Math.abs(deltaX);
                const overlapY = (first.height + second.height) / 2 + gap - Math.abs(deltaY);

                if (overlapX <= 0 || overlapY <= 0) continue;
                separated = true;

                const firstMobility = 0.28 + (1 - first.focus) * 0.72;
                const secondMobility = 0.28 + (1 - second.focus) * 0.72;
                const totalMobility = firstMobility + secondMobility;
                const firstShare = firstMobility / totalMobility;
                const secondShare = secondMobility / totalMobility;

                if (overlapX < overlapY) {
                  const direction = deltaX === 0
                    ? first.index < second.index ? -1 : 1
                    : Math.sign(deltaX);
                  first.x += direction * overlapX * firstShare;
                  second.x -= direction * overlapX * secondShare;
                } else {
                  const direction = deltaY === 0
                    ? first.index < second.index ? -1 : 1
                    : Math.sign(deltaY);
                  first.y += direction * overlapY * firstShare;
                  second.y -= direction * overlapY * secondShare;
                }
              }
            }

            if (!separated) break;
          }
        }

        function targetLayout() {
          const centerY = state.height / 2;
          const reduced = reducedMotion.matches;
          const chaos = chaosLevel();

          const size = lensLevel();
          const targets = state.tiles.filter((tile) => tile.visible).map((tile) => {
            const naturalX = state.cameraX + tile.baseX;
            const naturalY = state.cameraY + tile.baseY;
            const normalizedY = (naturalY - centerY) / (state.height * 0.62);
            const focus = Math.exp(-(normalizedY ** 2) * 2.7);
            const edge = 1 - focus;
            const edgeStrength = edge ** 1.35;
            const scale = (reduced ? 0.76 + focus * 0.24 : 0.32 + focus * 1.36) * size;
            const rotation = reduced ? 0 : tile.rotationNoise * 7.65 * edgeStrength * chaos;
            const x = naturalX + tile.edgeNoiseX * state.unit * edgeStrength * chaos;
            const y =
              naturalY + tile.edgeNoiseY * state.unit * 0.67 * edgeStrength * chaos;
            const verticalFade = 1 - smoothstep(
              state.height * 0.5,
              state.height * 0.7,
              Math.abs(y - centerY),
            );
            const opacity = clamp(verticalFade, 0, 1);
            const bounds = rotatedBounds(tile.width, tile.height, scale, rotation);

            return {
              index: tile.index,
              tile,
              x,
              y,
              width: bounds.width,
              height: bounds.height,
              scale,
              rotation,
              opacity,
              focus,
            };
          });

          separate(targets, targetGap, 14);
          return targets;
        }

        function viscousStep(tile, property, motionProperty, target, stiffness, friction) {
          tile[motionProperty] =
            (tile[motionProperty] + (target - tile[property]) * stiffness) * friction;
          tile[property] += tile[motionProperty];
        }

        function render() {
          const targets = targetLayout();
          const reduced = reducedMotion.matches;
          const viscosity = viscosityLevel();
          const interactionBoost = state.pointerId === null ? 1 : 1.35;
          const positionStiffness = mix(0.18, 0.025, viscosity) * interactionBoost;
          const positionFriction = mix(0.68, 0.48, viscosity);
          const transformStiffness = mix(0.13, 0.018, viscosity) * interactionBoost;
          const transformFriction = mix(0.66, 0.5, viscosity);
          const opacityResponse = mix(0.3, 0.08, viscosity);
          let unsettled = false;

          const visible = targets.map((target) => {
            const tile = target.tile;

            if (!Number.isFinite(tile.x)) {
              tile.x = target.x;
              tile.y = target.y;
              tile.scale = target.scale;
              tile.rotation = target.rotation;
              tile.opacity = target.opacity;
              tile.motionX = 0;
              tile.motionY = 0;
              tile.motionScale = 0;
              tile.motionRotation = 0;
            } else if (reduced) {
              tile.x = target.x;
              tile.y = target.y;
              tile.scale = target.scale;
              tile.rotation = target.rotation;
              tile.opacity = target.opacity;
              tile.motionX = 0;
              tile.motionY = 0;
              tile.motionScale = 0;
              tile.motionRotation = 0;
            } else {
              unsettled ||= Math.abs(target.x - tile.x) > 0.08;
              unsettled ||= Math.abs(target.y - tile.y) > 0.08;
              unsettled ||= Math.abs(target.scale - tile.scale) > 0.0008;
              unsettled ||= Math.abs(target.rotation - tile.rotation) > 0.005;
              unsettled ||= Math.abs(tile.motionX) > 0.01;
              unsettled ||= Math.abs(tile.motionY) > 0.01;
              unsettled ||= Math.abs(tile.motionScale) > 0.0001;
              unsettled ||= Math.abs(tile.motionRotation) > 0.001;
              viscousStep(
                tile,
                "x",
                "motionX",
                target.x,
                positionStiffness,
                positionFriction,
              );
              viscousStep(
                tile,
                "y",
                "motionY",
                target.y,
                positionStiffness,
                positionFriction,
              );
              viscousStep(
                tile,
                "scale",
                "motionScale",
                target.scale,
                transformStiffness,
                transformFriction,
              );
              viscousStep(
                tile,
                "rotation",
                "motionRotation",
                target.rotation,
                transformStiffness,
                transformFriction,
              );
              tile.opacity += (target.opacity - tile.opacity) * opacityResponse;
            }

            const bounds = rotatedBounds(tile.width, tile.height, tile.scale, tile.rotation);
            return {
              index: tile.index,
              tile,
              x: tile.x,
              y: tile.y,
              width: bounds.width,
              height: bounds.height,
              opacity: tile.opacity,
              focus: target.focus,
            };
          });

          separate(visible, minimumGap + 0.15, 8);

          visible.forEach(({ tile, x, y, focus }) => {
            tile.x = x;
            tile.y = y;
            tile.element.style.setProperty("--x", `${(x - tile.width / 2).toFixed(2)}px`);
            tile.element.style.setProperty("--y", `${(y - tile.height / 2).toFixed(2)}px`);
            tile.element.style.setProperty("--scale", tile.scale.toFixed(4));
            tile.element.style.setProperty("--rotation", `${tile.rotation.toFixed(2)}deg`);
            tile.element.style.setProperty("--opacity", tile.opacity.toFixed(3));
            tile.element.style.zIndex = String(Math.round(focus * 1000));
          });

          return unsettled;
        }

        function applyBoundarySpring() {
          const overscroll = 54;
          const minimumY = Math.min(overscroll, state.height - state.planeHeight - overscroll);
          let displaced = false;

          if (state.cameraY > overscroll) {
            state.velocityY += (overscroll - state.cameraY) * 0.055;
            displaced = true;
          } else if (state.cameraY < minimumY) {
            state.velocityY += (minimumY - state.cameraY) * 0.055;
            displaced = true;
          }

          return displaced;
        }

        function animate() {
          state.frame = 0;
          const reduced = reducedMotion.matches;

          if (state.pointerId === null) {
            state.cameraY += state.velocityY;
            state.velocityY *= reduced ? 0 : mix(0.92, 0.76, viscosityLevel());
          }

          const displaced = applyBoundarySpring();
          const unsettled = render();
          const moving =
            state.pointerId !== null ||
            Math.abs(state.velocityY) > 0.015;

          if (moving || displaced || unsettled) requestFrame();
        }

        function requestFrame() {
          if (state.frame) return;
          state.frame = requestAnimationFrame(animate);
        }

        function interact() {
          gallery.classList.add("has-interacted");
          requestFrame();
        }

        gallery.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          if (event.target.closest("a, button, input, label")) return;
          state.pointerId = event.pointerId;
          state.pointerY = event.clientY;
          state.velocityY = 0;
          gallery.setPointerCapture(event.pointerId);
          gallery.classList.add("is-dragging");
          interact();
        });

        gallery.addEventListener("pointermove", (event) => {
          if (event.pointerId !== state.pointerId) return;
          const deltaY = event.clientY - state.pointerY;
          state.pointerY = event.clientY;
          state.cameraY += deltaY;
          state.velocityY = deltaY;
          requestFrame();
        });

        function endPointer(event) {
          if (event.pointerId !== state.pointerId) return;
          state.pointerId = null;
          gallery.classList.remove("is-dragging");
          if (gallery.hasPointerCapture(event.pointerId)) {
            gallery.releasePointerCapture(event.pointerId);
          }
          requestFrame();
        }

        gallery.addEventListener("pointerup", endPointer);
        gallery.addEventListener("pointercancel", endPointer);

        gallery.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            const vertical = event.deltaY;

            if (reducedMotion.matches) {
              state.cameraY -= vertical * 0.8;
            } else {
              state.velocityY -= vertical * mix(0.09, 0.04, viscosityLevel());
            }
            interact();
          },
          { passive: false },
        );

        gallery.addEventListener("keydown", (event) => {
          if (event.target.closest("a, button, input, label")) return;
          const distance = event.shiftKey ? 42 : 20;
          const direction = {
            ArrowUp: distance,
            ArrowDown: -distance,
          }[event.key];

          if (!direction) return;
          event.preventDefault();
          state.velocityY += direction;
          interact();
        });

        document.querySelector("#shuffle").addEventListener("click", () => {
          state.seed = Math.floor(Math.random() * 100000);
          createTiles();
          layout({ recenter: true });
        });

        document.querySelector("#reset").addEventListener("click", () => {
          state.seed = 28117;
          state.activeTags.clear();
          chaosControl.value = defaultChaos;
          lensControl.value = defaultLens;
          viscosityControl.value = defaultViscosity;
          updateChaosControl();
          updateLensControl();
          updateViscosityControl();
          updateFilterButtons();
          createTiles();
          layout({ recenter: true });
        });

        filterButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const tag = button.dataset.tag;
            if (tag === "All") {
              state.activeTags.clear();
            } else if (state.activeTags.has(tag)) {
              state.activeTags.delete(tag);
            } else {
              state.activeTags.add(tag);
            }
            updateFilterButtons();
            layout({ recenter: true });
          });
        });

        chaosControl.addEventListener("input", () => {
          updateChaosControl();
          layout();
        });

        lensControl.addEventListener("input", () => {
          updateLensControl();
          requestFrame();
        });

        viscosityControl.addEventListener("input", () => {
          updateViscosityControl();
          requestFrame();
        });

        new ResizeObserver(() => layout({ recenter: true })).observe(gallery);
        reducedMotion.addEventListener("change", () => {
          state.velocityY = 0;
          requestFrame();
        });

        updateChaosControl();
        updateLensControl();
        updateViscosityControl();
        updateFilterButtons();
        createTiles();
        layout({ recenter: true });
      })();
    </script>
  </body>
</html>
