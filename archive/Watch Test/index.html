<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A draggable Apple Watch-inspired image grid with adjustable randomness."
    />
    <title>Orbit Grid — Apple Watch Motion Study</title>

    <style>
      :root {
        color-scheme: dark;
        --page: #050505;
        --surface: rgba(22, 22, 23, 0.82);
        --surface-strong: #111112;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f6f6f7;
        --muted: #929299;
        --accent: #c8ff4f;
        --accent-ink: #111500;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--page);
      }

      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 75% 42%, rgba(103, 72, 255, 0.13), transparent 32rem),
          radial-gradient(circle at 8% 90%, rgba(200, 255, 79, 0.08), transparent 28rem),
          var(--page);
        color: var(--text);
      }

      button,
      input {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      .watch-viewport:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(17rem, 21rem) minmax(0, 1fr);
        gap: clamp(2rem, 5vw, 6rem);
        width: min(100% - 2.5rem, 100rem);
        min-height: 100svh;
        margin: 0 auto;
        padding: 1.25rem 0;
      }

      .info-panel {
        position: relative;
        z-index: 4;
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 0.75rem 0 1rem;
      }

      .brand {
        display: inline-flex;
        gap: 0.65rem;
        align-items: center;
        width: fit-content;
        color: var(--text);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .brand-dot {
        width: 0.75rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 1rem rgba(200, 255, 79, 0.45);
      }

      .intro {
        margin: auto 0;
        padding: 4rem 0 3rem;
      }

      .eyebrow {
        display: flex;
        gap: 0.65rem;
        align-items: center;
        margin: 0 0 1.2rem;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 2rem;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 7ch;
        margin: 0;
        font-size: clamp(3.7rem, 6vw, 6.8rem);
        font-weight: 560;
        letter-spacing: -0.075em;
        line-height: 0.84;
      }

      .intro-copy {
        max-width: 27rem;
        margin: 1.8rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.62;
      }

      .controls-card {
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: var(--surface);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(1.5rem) saturate(130%);
      }

      .controls-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.1rem 0.85rem;
        border-bottom: 1px solid var(--line);
      }

      .controls-title {
        margin: 0;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .live-indicator {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .live-indicator::before {
        width: 0.38rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0.7rem rgba(200, 255, 79, 0.6);
        content: "";
      }

      .controls {
        display: grid;
        gap: 1rem;
        padding: 1rem 1.1rem 1.15rem;
      }

      .control {
        display: grid;
        gap: 0.55rem;
      }

      .control-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.76rem;
      }

      .control-value {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        height: 1.15rem;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 0.23rem;
        border-radius: 99px;
        background: linear-gradient(
          to right,
          var(--accent) 0 var(--progress, 50%),
          rgba(255, 255, 255, 0.13) var(--progress, 50%) 100%
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 0.95rem;
        height: 0.95rem;
        margin-top: -0.36rem;
        appearance: none;
        border: 0;
        border-radius: 50%;
        background: #fafafa;
        box-shadow: 0 0.12rem 0.45rem rgba(0, 0, 0, 0.35);
      }

      input[type="range"]::-moz-range-track {
        height: 0.23rem;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.13);
      }

      input[type="range"]::-moz-range-progress {
        height: 0.23rem;
        border-radius: 99px;
        background: var(--accent);
      }

      input[type="range"]::-moz-range-thumb {
        width: 0.95rem;
        height: 0.95rem;
        border: 0;
        border-radius: 50%;
        background: #fafafa;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.55rem;
        padding-top: 0.25rem;
      }

      .button {
        min-height: 2.65rem;
        padding: 0 1rem;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        cursor: pointer;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        transition:
          transform 160ms ease,
          background-color 160ms ease;
      }

      .button:hover {
        background: rgba(255, 255, 255, 0.11);
        transform: translateY(-1px);
      }

      .button-primary {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-ink);
      }

      .button-primary:hover {
        background: #d6ff78;
      }

      .stage {
        position: relative;
        display: grid;
        min-width: 0;
        place-items: center;
      }

      .stage-glow {
        position: absolute;
        width: min(76vw, 52rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(200, 255, 79, 0.055), transparent 65%);
        filter: blur(1rem);
        pointer-events: none;
      }

      .watch-shell {
        position: relative;
        width: min(100%, 48rem, 76vh);
        aspect-ratio: 0.86;
        padding: clamp(0.45rem, 1vw, 0.8rem);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: clamp(4rem, 10vw, 7.5rem);
        background: linear-gradient(145deg, #2b2b2e 0%, #0d0d0e 40%, #222225 100%);
        box-shadow:
          0 3rem 8rem rgba(0, 0, 0, 0.58),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .watch-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: clamp(3.5rem, 9vw, 6.8rem);
        background:
          radial-gradient(circle at 50% 45%, #161617 0%, #090909 62%, #020202 100%);
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .watch-viewport.is-dragging {
        cursor: grabbing;
      }

      .watch-viewport::after {
        position: absolute;
        z-index: 5;
        inset: 0;
        border-radius: inherit;
        box-shadow:
          inset 0 0 3rem rgba(0, 0, 0, 0.72),
          inset 0 0 0 1px rgba(255, 255, 255, 0.035);
        content: "";
        pointer-events: none;
      }

      .image-plane {
        position: absolute;
        top: 0;
        left: 0;
        transform: translate3d(var(--plane-x, 0), var(--plane-y, 0), 0);
        transform-origin: 0 0;
        will-change: transform;
      }

      .image-tile {
        position: absolute;
        display: block;
        width: var(--tile-width);
        height: var(--tile-height);
        margin: 0;
        opacity: var(--tile-opacity, 0);
        transform:
          translate3d(var(--bend-x, 0), var(--bend-y, 0), 0)
          rotate(var(--tile-rotation, 0deg))
          scale(var(--tile-scale, 0.2));
        transform-origin: center;
        will-change: transform, opacity, filter;
      }

      .image-tile img {
        display: block;
        width: 100%;
        height: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: var(--tile-radius, 28%);
        object-fit: cover;
        box-shadow: 0 0.8rem 2.4rem rgba(0, 0, 0, 0.38);
        filter: saturate(0.95) contrast(1.04);
        pointer-events: none;
      }

      .ratio-badge {
        position: absolute;
        right: 8%;
        bottom: 8%;
        padding: 0.28rem 0.38rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.52);
        color: #fff;
        font-size: clamp(0.42rem, 0.75vw, 0.62rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        backdrop-filter: blur(0.5rem);
      }

      .interaction-hint {
        position: absolute;
        z-index: 7;
        bottom: 1.6rem;
        left: 50%;
        display: flex;
        gap: 0.55rem;
        align-items: center;
        padding: 0.6rem 0.8rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.48);
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.65rem;
        font-weight: 650;
        letter-spacing: 0.09em;
        pointer-events: none;
        text-transform: uppercase;
        transform: translateX(-50%);
        backdrop-filter: blur(0.8rem);
        transition: opacity 220ms ease;
      }

      .interaction-hint::before {
        width: 0.45rem;
        height: 0.7rem;
        border: 1px solid currentColor;
        border-radius: 0.35rem;
        content: "";
      }

      .watch-viewport.has-interacted .interaction-hint {
        opacity: 0;
      }

      @media (max-width: 900px) {
        .app-shell {
          display: block;
          width: min(100% - 2rem, 46rem);
          padding-bottom: 3rem;
        }

        .info-panel {
          min-height: auto;
        }

        .intro {
          padding: 5rem 0 2.5rem;
        }

        h1 {
          max-width: 9ch;
        }

        .controls-card {
          margin-bottom: 2rem;
        }

        .controls {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .actions {
          grid-column: 1 / -1;
        }

        .stage {
          min-height: 0;
        }

        .watch-shell {
          width: min(100%, 40rem);
        }
      }

      @media (max-width: 520px) {
        .app-shell {
          width: min(100% - 1.2rem, 40rem);
        }

        .intro {
          padding-top: 4rem;
        }

        h1 {
          font-size: clamp(3.3rem, 17vw, 5.1rem);
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .actions {
          grid-column: 1;
        }

        .watch-shell {
          border-radius: 3.6rem;
        }

        .watch-viewport {
          border-radius: 3.15rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button,
        .interaction-hint {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="app-shell">
      <section class="info-panel" aria-labelledby="page-title">
        <a class="brand" href="#" aria-label="Orbit Grid home">
          <span class="brand-dot" aria-hidden="true"></span>
          Orbit Grid
        </a>

        <div class="intro">
          <p class="eyebrow">Watch motion study</p>
          <h1 id="page-title">Move the whole world.</h1>
          <p class="intro-copy">
            Drag or scroll the image field. Tiles grow into focus and fold away around the
            curved edges, like the Apple Watch home screen.
          </p>
        </div>

        <aside class="controls-card" aria-label="Grid controls">
          <div class="controls-header">
            <h2 class="controls-title">Motion lab</h2>
            <span class="live-indicator">Live</span>
          </div>

          <div class="controls">
            <label class="control" for="randomness">
              <span class="control-label">
                Randomness
                <output class="control-value" id="randomness-value" for="randomness">42%</output>
              </span>
              <input id="randomness" type="range" min="0" max="100" value="42" />
            </label>

            <label class="control" for="size-variance">
              <span class="control-label">
                Size variance
                <output class="control-value" id="size-variance-value" for="size-variance">36%</output>
              </span>
              <input id="size-variance" type="range" min="0" max="100" value="36" />
            </label>

            <label class="control" for="scatter">
              <span class="control-label">
                Grid scatter
                <output class="control-value" id="scatter-value" for="scatter">28%</output>
              </span>
              <input id="scatter" type="range" min="0" max="100" value="28" />
            </label>

            <label class="control" for="edge-curve">
              <span class="control-label">
                Edge curve
                <output class="control-value" id="edge-curve-value" for="edge-curve">78%</output>
              </span>
              <input id="edge-curve" type="range" min="0" max="100" value="78" />
            </label>

            <label class="control" for="rotation">
              <span class="control-label">
                Rotation
                <output class="control-value" id="rotation-value" for="rotation">20%</output>
              </span>
              <input id="rotation" type="range" min="0" max="100" value="20" />
            </label>

            <div class="actions">
              <button class="button button-primary" id="shuffle" type="button">Shuffle grid</button>
              <button class="button" id="reset" type="button">Reset</button>
            </div>
          </div>
        </aside>
      </section>

      <section class="stage" aria-label="Interactive Apple Watch-inspired image grid">
        <div class="stage-glow" aria-hidden="true"></div>
        <div class="watch-shell">
          <div
            class="watch-viewport"
            id="watch-viewport"
            role="application"
            tabindex="0"
            aria-label="Draggable image grid. Drag, scroll, or use the arrow keys to move."
          >
            <div class="image-plane" id="image-plane"></div>
            <div class="interaction-hint" aria-hidden="true">Drag or scroll</div>
          </div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const viewport = document.querySelector("#watch-viewport");
        const plane = document.querySelector("#image-plane");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        const defaults = {
          randomness: 42,
          "size-variance": 36,
          scatter: 28,
          "edge-curve": 78,
          rotation: 20,
        };

        const sources = [
          {
            ratio: "1:1",
            width: 1000,
            height: 1000,
            src: "https://picsum.photos/seed/orbit-salt/1000/1000",
            alt: "Atmospheric landscape in a square crop",
          },
          {
            ratio: "4:5",
            width: 1000,
            height: 1250,
            src: "https://picsum.photos/seed/orbit-stone/1000/1250",
            alt: "Editorial scene in a four by five crop",
          },
          {
            ratio: "16:9",
            width: 1600,
            height: 900,
            src: "https://picsum.photos/seed/orbit-road/1600/900",
            alt: "Cinematic landscape in a widescreen crop",
          },
          {
            ratio: "9:16",
            width: 900,
            height: 1600,
            src: "https://picsum.photos/seed/orbit-tower/900/1600",
            alt: "Tall architecture in a vertical crop",
          },
          {
            ratio: "1:1",
            width: 1000,
            height: 1000,
            src: "https://picsum.photos/seed/orbit-water/1000/1000",
            alt: "Water and light in a square crop",
          },
          {
            ratio: "4:5",
            width: 1000,
            height: 1250,
            src: "https://picsum.photos/seed/orbit-desert/1000/1250",
            alt: "Desert tones in a portrait crop",
          },
          {
            ratio: "16:9",
            width: 1600,
            height: 900,
            src: "https://picsum.photos/seed/orbit-night/1600/900",
            alt: "Night landscape in a widescreen crop",
          },
          {
            ratio: "9:16",
            width: 900,
            height: 1600,
            src: "https://picsum.photos/seed/orbit-forest/900/1600",
            alt: "Forest scene in a tall vertical crop",
          },
        ];

        const controls = Object.fromEntries(
          Object.keys(defaults).map((name) => [name, document.querySelector(`#${name}`)]),
        );

        const state = {
          seed: 9271,
          x: 0,
          y: 0,
          targetX: 0,
          targetY: 0,
          velocityX: 0,
          velocityY: 0,
          pointerId: null,
          pointerX: 0,
          pointerY: 0,
          planeWidth: 0,
          planeHeight: 0,
          viewportWidth: 0,
          viewportHeight: 0,
          frame: 0,
          tiles: [],
        };

        const rows = 9;
        const columns = 8;

        function value(name) {
          return Number(controls[name].value) / 100;
        }

        function noise(index, channel = 0) {
          const raw = Math.sin(state.seed * 0.017 + index * 88.31 + channel * 41.77) * 43758.5453;
          return (raw - Math.floor(raw)) * 2 - 1;
        }

        function smoothstep(start, end, input) {
          const t = Math.max(0, Math.min(1, (input - start) / (end - start)));
          return t * t * (3 - 2 * t);
        }

        function updateControl(input) {
          const output = document.querySelector(`#${input.id}-value`);
          output.value = `${input.value}%`;
          input.style.setProperty("--progress", `${input.value}%`);
        }

        function createTiles() {
          plane.replaceChildren();
          state.tiles = [];

          for (let row = 0; row < rows; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const index = row * columns + column;
              const sourceIndex = Math.abs(
                Math.floor(index * 3 + noise(index, 7) * sources.length),
              ) % sources.length;
              const source = sources[sourceIndex];
              const figure = document.createElement("figure");
              const image = document.createElement("img");
              const caption = document.createElement("figcaption");

              figure.className = "image-tile";
              image.src = source.src;
              image.alt = source.alt;
              image.width = source.width;
              image.height = source.height;
              image.draggable = false;
              image.loading = index < 18 ? "eager" : "lazy";
              caption.className = "ratio-badge";
              caption.textContent = source.ratio;

              figure.append(image, caption);
              plane.append(figure);
              state.tiles.push({
                element: figure,
                row,
                column,
                index,
                aspect: source.width / source.height,
                randomX: noise(index, 1),
                randomY: noise(index, 2),
                randomSize: noise(index, 3),
                randomRotation: noise(index, 4),
              });
            }
          }
        }

        function clampPosition() {
          const overscroll = 36;
          const minX = Math.min(overscroll, state.viewportWidth - state.planeWidth - overscroll);
          const minY = Math.min(overscroll, state.viewportHeight - state.planeHeight - overscroll);
          state.targetX = Math.max(minX, Math.min(overscroll, state.targetX));
          state.targetY = Math.max(minY, Math.min(overscroll, state.targetY));
        }

        function layoutTiles({ recenter = false } = {}) {
          const rect = viewport.getBoundingClientRect();
          state.viewportWidth = rect.width;
          state.viewportHeight = rect.height;

          const compact = rect.width < 520;
          const unit = compact ? Math.max(72, rect.width * 0.22) : Math.max(94, rect.width * 0.17);
          const columnStep = unit * 1.22;
          const rowStep = unit * 1.05;
          const randomness = value("randomness");
          const sizeVariance = value("size-variance") * randomness;
          const scatter = value("scatter") * randomness;
          const rotation = value("rotation") * randomness;
          const padding = unit * 1.25;

          state.planeWidth = padding * 2 + columnStep * (columns - 0.5) + unit;
          state.planeHeight = padding * 2 + rowStep * (rows - 1) + unit;
          plane.style.width = `${state.planeWidth}px`;
          plane.style.height = `${state.planeHeight}px`;

          state.tiles.forEach((tile) => {
            const wide = tile.aspect > 1.2;
            const tall = tile.aspect < 0.8;
            const baseWidth = unit * (wide ? 1.18 : tall ? 0.72 : tile.aspect < 0.95 ? 0.86 : 0.96);
            const baseHeight = baseWidth / tile.aspect;
            const sizeMultiplier = 1 + tile.randomSize * sizeVariance * 0.28;
            const width = baseWidth * sizeMultiplier;
            const height = baseHeight * sizeMultiplier;
            const stagger = tile.row % 2 ? columnStep / 2 : 0;
            const scatterDistance = unit * 0.4 * scatter;
            const centerX =
              padding + tile.column * columnStep + stagger + tile.randomX * scatterDistance;
            const centerY =
              padding + tile.row * rowStep + tile.randomY * scatterDistance;

            tile.width = width;
            tile.height = height;
            tile.centerX = centerX;
            tile.centerY = centerY;
            tile.element.style.left = `${centerX - width / 2}px`;
            tile.element.style.top = `${centerY - height / 2}px`;
            tile.element.style.setProperty("--tile-width", `${width}px`);
            tile.element.style.setProperty("--tile-height", `${height}px`);
            tile.element.style.setProperty(
              "--tile-radius",
              wide ? "22%" : tall ? "31%" : "28%",
            );
            tile.rotation = tile.randomRotation * rotation * 16;
          });

          if (recenter) {
            state.x = (state.viewportWidth - state.planeWidth) / 2;
            state.y = (state.viewportHeight - state.planeHeight) / 2;
            state.targetX = state.x;
            state.targetY = state.y;
          } else {
            clampPosition();
          }

          requestFrame();
        }

        function axisEffect(position, length, curve) {
          const edgeBand = length * (0.12 + curve * 0.16);
          const outerBand = length * 0.18;
          const leftScale = smoothstep(-outerBand, edgeBand, position);
          const rightScale = 1 - smoothstep(length - edgeBand, length + outerBand, position);
          const scale = Math.min(leftScale, rightScale);

          let bend = 0;
          if (position < edgeBand) {
            bend = (1 - smoothstep(-outerBand, edgeBand, position)) * length * 0.11;
          } else if (position > length - edgeBand) {
            bend = -smoothstep(length - edgeBand, length + outerBand, position) * length * 0.11;
          }

          return { scale, bend };
        }

        function renderTiles() {
          const edgeCurve = value("edge-curve");
          const reduced = reducedMotion.matches;

          state.tiles.forEach((tile) => {
            const x = state.x + tile.centerX;
            const y = state.y + tile.centerY;
            const horizontal = axisEffect(x, state.viewportWidth, edgeCurve);
            const vertical = axisEffect(y, state.viewportHeight, edgeCurve);
            const edgeScale = Math.max(0.04, Math.min(horizontal.scale, vertical.scale));
            const scale = reduced ? Math.max(0.5, edgeScale) : 0.16 + edgeScale * 0.88;
            const bendFactor = reduced ? 0.3 : edgeCurve;
            const bendX = horizontal.bend * bendFactor;
            const bendY = vertical.bend * bendFactor;
            const opacity = Math.max(0, Math.min(1, (edgeScale - 0.02) * 1.7));
            const rotation = tile.rotation * (0.35 + edgeScale * 0.65);

            tile.element.style.setProperty("--bend-x", `${bendX.toFixed(2)}px`);
            tile.element.style.setProperty("--bend-y", `${bendY.toFixed(2)}px`);
            tile.element.style.setProperty("--tile-scale", scale.toFixed(4));
            tile.element.style.setProperty("--tile-opacity", opacity.toFixed(3));
            tile.element.style.setProperty("--tile-rotation", `${rotation.toFixed(2)}deg`);
          });
        }

        function animate() {
          state.frame = 0;
          const ease = reducedMotion.matches ? 1 : state.pointerId === null ? 0.16 : 0.32;
          state.x += (state.targetX - state.x) * ease;
          state.y += (state.targetY - state.y) * ease;
          plane.style.setProperty("--plane-x", `${state.x.toFixed(2)}px`);
          plane.style.setProperty("--plane-y", `${state.y.toFixed(2)}px`);
          renderTiles();

          if (Math.abs(state.targetX - state.x) > 0.08 || Math.abs(state.targetY - state.y) > 0.08) {
            requestFrame();
          }
        }

        function requestFrame() {
          if (state.frame) return;
          state.frame = requestAnimationFrame(animate);
        }

        function moveBy(deltaX, deltaY) {
          state.targetX += deltaX;
          state.targetY += deltaY;
          clampPosition();
          viewport.classList.add("has-interacted");
          requestFrame();
        }

        viewport.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 && event.pointerType === "mouse") return;
          state.pointerId = event.pointerId;
          state.pointerX = event.clientX;
          state.pointerY = event.clientY;
          viewport.setPointerCapture(event.pointerId);
          viewport.classList.add("is-dragging", "has-interacted");
        });

        viewport.addEventListener("pointermove", (event) => {
          if (event.pointerId !== state.pointerId) return;
          const deltaX = event.clientX - state.pointerX;
          const deltaY = event.clientY - state.pointerY;
          state.pointerX = event.clientX;
          state.pointerY = event.clientY;
          moveBy(deltaX, deltaY);
        });

        function endPointer(event) {
          if (event.pointerId !== state.pointerId) return;
          state.pointerId = null;
          viewport.classList.remove("is-dragging");
          if (viewport.hasPointerCapture(event.pointerId)) {
            viewport.releasePointerCapture(event.pointerId);
          }
        }

        viewport.addEventListener("pointerup", endPointer);
        viewport.addEventListener("pointercancel", endPointer);

        viewport.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            const horizontal = Math.abs(event.deltaX) > 1 ? event.deltaX : event.shiftKey ? event.deltaY : 0;
            const vertical = event.shiftKey ? 0 : event.deltaY;
            moveBy(-horizontal * 0.85, -vertical * 0.85);
          },
          { passive: false },
        );

        viewport.addEventListener("keydown", (event) => {
          const step = event.shiftKey ? 120 : 52;
          const movement = {
            ArrowLeft: [step, 0],
            ArrowRight: [-step, 0],
            ArrowUp: [0, step],
            ArrowDown: [0, -step],
          }[event.key];

          if (!movement) return;
          event.preventDefault();
          moveBy(movement[0], movement[1]);
        });

        Object.values(controls).forEach((input) => {
          updateControl(input);
          input.addEventListener("input", () => {
            updateControl(input);
            layoutTiles();
          });
        });

        document.querySelector("#shuffle").addEventListener("click", () => {
          state.seed = Math.floor(Math.random() * 100000);
          createTiles();
          layoutTiles({ recenter: true });
        });

        document.querySelector("#reset").addEventListener("click", () => {
          state.seed = 9271;
          Object.entries(defaults).forEach(([name, defaultValue]) => {
            controls[name].value = defaultValue;
            updateControl(controls[name]);
          });
          createTiles();
          layoutTiles({ recenter: true });
        });

        const resizeObserver = new ResizeObserver(() => layoutTiles({ recenter: true }));
        resizeObserver.observe(viewport);
        reducedMotion.addEventListener("change", requestFrame);

        createTiles();
        layoutTiles({ recenter: true });
      })();
    </script>
  </body>
</html>
